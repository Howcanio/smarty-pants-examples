name: Mac check on Smarty Pants

# Runs on a fresh macOS VM on one of our own Macs, through Smarty Pants GitHub Mac runners
# (free on your own or your Group's Macs). Start it from the Actions tab, or let the nightly check do it.
on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: [self-hosted, smartypants-macos]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Where this ran
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string
          xcodebuild -version || echo "no Xcode in this VM"
      - name: Python example runs on the Mac
        run: python3 --version && ls python
